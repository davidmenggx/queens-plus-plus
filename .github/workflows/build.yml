name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, preset: windows-debug }
          - { os: windows-latest, preset: windows-release }
          - { os: ubuntu-24.04, preset: linux-debug }
          - { os: ubuntu-24.04, preset: linux-release }
    steps:
      - uses: actions/checkout@v7

      # Puts cl, cmake and ninja on the PATH for the Ninja generator.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # From SDL's docs/README-linux.md. Without X11/Wayland SDL refuses to
      # configure, and without the rest it silently drops audio, input, etc.
      - name: Install SDL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev \
            libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev \
            libdecor-0-dev liburing-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Install
        run: cmake --install build/${{ matrix.preset }}
